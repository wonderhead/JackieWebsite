<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jacqueline Trinh-Juarez</title>
    <script>
      // GitHub Pages SPA fallback for jacqueline-trinh-juarez.com.
      var pathSegmentsToKeep = 0
      var locationParts = window.location
      locationParts.replace(
        locationParts.protocol +
          '//' +
          locationParts.hostname +
          (locationParts.port ? ':' + locationParts.port : '') +
          locationParts.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?p=/' +
          locationParts.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (locationParts.search
            ? '&q=' + locationParts.search.slice(1).replace(/&/g, '~and~')
            : '') +
          locationParts.hash,
      )
    </script>
  </head>
  <body></body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf7" />
    <script>
      (function (location) {
        if (location.search.startsWith('?p=/')) {
          var route = location.search.slice(4).split('&q=');
          window.history.replaceState(
            null,
            '',
            location.pathname.replace(/\/$/, '') + '/' +
              route[0].replace(/~and~/g, '&') +
              (route[1] ? '?' + route[1].replace(/~and~/g, '&') : '') +
              location.hash
          );
        }
      })(window.location);
    </script>
    <title>Jacqueline Trinh-Juarez</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
